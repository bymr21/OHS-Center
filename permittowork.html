<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permit to Work - OHS Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between">

    <!-- Tombol Kembali ke Beranda -->
    <div class="p-6">
        <a href="index.html" class="inline-flex items-center text-xs text-slate-500 hover:text-slate-900 transition-colors bg-white px-3 py-2 rounded-xl shadow-sm border border-slate-200">
            <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
            Kembali ke Beranda
        </a>
    </div>

    <!-- Konten Utama: Form Permit to Work -->
    <main class="max-w-2xl mx-auto px-6 py-4 flex-grow">
        
        <!-- Logo & Header Form -->
        <div class="text-center mb-8">
            <img src="permittowork.png" alt="Permit to Work Logo" class="w-20 h-20 rounded-full object-cover shadow-md border-2 border-slate-100 mx-auto mb-4">
            <h1 class="text-2xl font-extrabold text-slate-900">Permit to Work (PTW)</h1>
            <p class="text-xs text-slate-500 mt-1">Formulir pengajuan izin kerja aman untuk aktivitas berisiko tinggi.</p>
        </div>

        <!-- Kartu Form -->
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-100">
            <form action="#" method="POST" class="space-y-4">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Pemohon</label>
                    <input type="text" placeholder="Masukkan nama lengkap" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Jenis Pekerjaan</label>
                    <select class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        <option value="" disabled selected>Pilih jenis izin kerja</option>
                        <option value="hot-work">Hot Work (Pekerjaan Panas)</option>
                        <option value="cold-work">Cold Work (Pekerjaan Dingin)</option>
                        <option value="height">Work at Height (Bekerja di Ketinggian)</option>
                        <option value="confined">Confined Space (Ruang Terbatas)</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Mulai</label>
                        <input type="date" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal Selesai</label>
                        <input type="date" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Lokasi Kerja</label>
                    <input type="text" placeholder="Contoh: Area Produksi / Gedung A" class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Deskripsi Pekerjaan</label>
                    <textarea rows="3" placeholder="Jelaskan ringkasan pekerjaan yang akan dilakukan..." class="w-full px-3 py-2 text-xs border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none" required></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white text-xs font-bold py-3 rounded-xl hover:bg-blue-700 transition-colors shadow-sm mt-4">
                    Kirim Pengajuan Permit
                </button>

            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-slate-400 text-[10px]">
        OHS Center &copy; 2026 | Safety & Compliance System
    </footer>

</body>
</html>
