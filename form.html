<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit to Work - OHS Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-6">

    <main class="max-w-2xl w-full mx-auto p-6">
        <div class="flex items-center gap-4 mb-6 pb-4 border-b border-slate-300">
            <div class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold text-xl">OHS</div>
            <div>
                <h2 class="text-2xl font-bold text-slate-800">Fit to Work</h2>
                <p class="text-xs text-slate-500">OHS Center - Fitness for Work Assessment</p>
            </div>
        </div>

        <form id="ohsForm" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-6">
            <!-- Data Diri -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Karyawan <span class="text-red-500">*</span></label>
                <input type="text" id="nama" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">NIK <span class="text-red-500">*</span></label>
                <input type="text" id="nik" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <!-- Pertanyaan -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Total waktu tidur Anda? <span class="text-red-500">*</span></label>
                <div class="space-y-1">
                    <label><input type="radio" name="waktutidur" value="< 5 JAM" required> < 5 JAM</label><br>
                    <label><input type="radio" name="waktutidur" value="5 JAM"> 5 JAM</label><br>
                    <label><input type="radio" name="waktutidur" value="6 JAM"> 6 JAM</label><br>
                    <label><input type="radio" name="waktutidur" value="7 JAM"> 7 JAM</label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Kualitas istirahat? <span class="text-red-500">*</span></label>
                <div class="space-y-1">
                    <label><input type="radio" name="kualitastidur" value="Sangat Buruk" required> Sangat Buruk</label><br>
                    <label><input type="radio" name="kualitastidur" value="Buruk"> Buruk</label><br>
                    <label><input type="radio" name="kualitastidur" value="Cukup"> Cukup</label><br>
                    <label><input type="radio" name="kualitastidur" value="Baik"> Baik</label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Gejala Kesehatan <span class="text-red-500">*</span></label>
                <div class="space-y-1">
                    <label><input type="checkbox" name="gejala" value="Sakit Kepala/Pusing"> Sakit Kepala / Pusing</label><br>
                    <label><input type="checkbox" name="gejala" value="Batuk/Pilek/Sesak"> Batuk / Pilek / Sesak Nafas</label><br>
                    <label><input type="checkbox" name="gejala" value="Sakit Perut/Mual"> Sakit Perut / Mual / Diare</label><br>
                    <label><input type="checkbox" name="gejala" value="Nyeri Otot"> Nyeri Otot / Pegal Linu</label><br>
                    <label><input type="checkbox" name="gejala" value="Pandangan Kabur"> Pandangan Kabur</label><br>
                    <label><input type="checkbox" name="gejala" value="Tidak Ada"> Tidak Ada Gejala</label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Kondisi Fokus & Pikiran <span class="text-red-500">*</span></label>
                <div class="space-y-1">
                    <label><input type="radio" name="fokus" value="Fokus & Tenang" required> Fokus & Tenang</label><br>
                    <label><input type="radio" name="fokus" value="Sedikit Terganggu"> Sedikit Terganggu</label><br>
                    <label><input type="radio" name="fokus" value="Sangat Terganggu"> Sangat Terganggu</label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Konsumsi obat 12 jam terakhir? <span class="text-red-500">*</span></label>
                <div class="space-y-1">
                    <label><input type="radio" name="obat" value="YA" required> YA</label>
                    <label><input type="radio" name="obat" value="TIDAK"> TIDAK</label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Kesiapan Bekerja <span class="text-red-500">*</span></label>
                <div class="space-y-1">
                    <label><input type="radio" name="kesiapan" value="SIAP & FIT" required> YA, SAYA SIAP & FIT</label><br>
                    <label><input type="radio" name="kesiapan" value="TIDAK FIT"> TIDAK, SAYA KURANG SEHAT</label>
                </div>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transition">
                Kirim Laporan
            </button>
        </form>
    </main>

    <script>
        document.getElementById('ohsForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nama = document.getElementById('nama').value;
            const nik = document.getElementById('nik').value;
            const tidur = document.querySelector('input[name="waktutidur"]:checked').value;
            const kualitas = document.querySelector('input[name="kualitastidur"]:checked').value;
            const gejala = Array.from(document.querySelectorAll('input[name="gejala"]:checked')).map(el => el.value);
            const fokus = document.querySelector('input[name="fokus"]:checked').value;
            const obat = document.querySelector('input[name="obat"]:checked').value;
            const kesiapan = document.querySelector('input[name="kesiapan"]:checked').value;

            const isDanger = (
                tidur === "< 5 JAM" || tidur === "5 JAM" ||
                kualitas === "Sangat Buruk" || kualitas === "Buruk" ||
                gejala.some(g => g !== "Tidak Ada") ||
                fokus !== "Fokus & Tenang" ||
                obat === "YA" ||
                kesiapan === "TIDAK FIT"
            );

            let pesan = "";
            if (isDanger) {
                pesan = `🚨 *URGENT: LAPORAN KETIDAKSIAPAN KERJA* 🚨%0A%0A` +
                        `Yth. Admin OHS,%0A` +
                        `Mohon perhatian, sistem mendeteksi potensi risiko:%0A%0A` +
                        `*Nama:* ${nama}%0A` +
                        `*NIK:* ${nik}%0A` +
                        `*Status:* ⚠️ TIDAK FIT / DANGER%0A%0A` +
                        `Mohon segera lakukan pengecekan fisik langsung kepada karyawan tersebut. Terima kasih.`;
            } else {
                pesan = `✅ *LAPORAN FIT TO WORK - AMAN*%0A%0A` +
                        `Yth. Admin OHS,%0A` +
                        `Berikut laporan harian Fit to Work:%0A%0A` +
                        `*Nama:* ${nama}%0A` +
                        `*NIK:* ${nik}%0A` +
                        `*Status:* SIAP & FIT%0A%0A` +
                        `Karyawan dalam kondisi prima. Terima kasih.`;
            }

            window.open(`https://wa.me/6282239689985?text=${pesan}`, '_blank');
        });
    </script>
</body>
</html>
