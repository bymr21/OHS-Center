<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OHS Center Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header dengan Logo Utama -->
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center space-x-3">
            <img src="logo.png" alt="Logo OHS Center" class="w-10 h-10 rounded-full shadow-md object-cover border border-slate-100 flex-shrink-0">
            <div>
                <h1 class="text-xl font-extrabold text-slate-900">OHS Center</h1>
                <p class="text-[10px] text-slate-500">Sistem Manajemen Keselamatan Kerja Terintegrasi</p>
            </div>
        </div>
    </header>

    <!-- Konten Menu Utama -->
    <main class="max-w-6xl mx-auto px-4 py-6">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-4">Menu Utama</h2>
        
        <!-- Grid: Langsung 3 Kolom Menyamping (grid-cols-3) tanpa md: -->
        <div class="grid grid-cols-3 gap-3">
            
            <!-- 1. Fit to Work -->
            <a href="fittowork.html" class="flex flex-col items-center text-center p-3 bg-white rounded-xl shadow-sm hover:shadow-md transition-all border border-slate-100 group">
                <img src="fittowork.png" alt="Fit to Work" class="w-12 h-12 rounded-full object-cover mb-2 border border-slate-100 group-hover:scale-105 transition-transform">
                <h2 class="text-xs font-bold text-slate-900 group-hover:text-blue-700 transition-colors">Fit to Work</h2>
                <p class="text-[9px] text-slate-500 mt-0.5 hidden sm:block">Pemeriksaan kesehatan mandiri harian.</p>
            </a>

            <!-- 2. Permit to Work -->
            <a href="ptw.html" class="flex flex-col items-center text-center p-3 bg-white rounded-xl shadow-sm hover:shadow-md transition-all border border-slate-100 group">
                <img src="permittowork.png" alt="Permit to Work" class="w-12 h-12 rounded-full object-cover mb-2 border border-slate-100 group-hover:scale-105 transition-transform">
                <h2 class="text-xs font-bold text-slate-900 group-hover:text-blue-700 transition-colors">Permit to Work</h2>
                <p class="text-[9px] text-slate-500 mt-0.5 hidden sm:block">Ajukan izin kerja berisiko tinggi.</p>
            </a>

            <!-- 3. Hazard Report -->
            <a href="hazard.html" class="flex flex-col items-center text-center p-3 bg-white rounded-xl shadow-sm hover:shadow-md transition-all border border-slate-100 group">
                <img src="hazardreport.png" alt="Hazard Report" class="w-12 h-12 rounded-full object-cover mb-2 border border-slate-100 group-hover:scale-105 transition-transform">
                <h2 class="text-xs font-bold text-slate-900 group-hover:text-amber-700 transition-colors">Hazard Report</h2>
                <p class="text-[9px] text-slate-500 mt-0.5 hidden sm:block">Laporkan bahaya atau kondisi tidak aman.</p>
            </a>

            <!-- 4. Monitoring PTW -->
            <a href="monitoring.html" class="flex flex-col items-center text-center p-3 bg-white rounded-xl shadow-sm hover:shadow-md transition-all border border-slate-100 group">
                <div class="w-12 h-12 rounded-full bg-emerald-100 flex items-center justify-center mb-2 border border-emerald-50 group-hover:bg-emerald-200 transition-colors">
                    <span class="text-xl">📊</span>
                </div>
                <h2 class="text-xs font-bold text-slate-900 group-hover:text-emerald-700 transition-colors">Monitoring PTW</h2>
                <p class="text-[9px] text-slate-500 mt-0.5 hidden sm:block">Pantau status izin kerja yang aktif.</p>
            </a>

        </div>
    </main>

</body>
</html>
