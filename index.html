<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OHS Center Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header dengan Logo Utama (logo.png) -->
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-6xl mx-auto px-6 py-6 flex items-center space-x-4">
            <!-- Logo Utama -->
            <img src="logo.png" alt="Logo OHS Center" class="w-14 h-14 rounded-full shadow-md object-cover border-2 border-slate-100 flex-shrink-0">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900">OHS Center</h1>
                <p class="text-xs text-slate-500">Sistem Manajemen Keselamatan Kerja Terintegrasi</p>
            </div>
        </div>
    </header>

    <!-- Konten Menu Utama -->
    <main class="max-w-6xl mx-auto px-6 py-10">
        <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-widest mb-6">Menu Utama</h2>
        
        <!-- Grid Menu: 3 Kolom ke Samping & Menurun ke Bawah -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- 1. Fit to Work -->
            <a href="fittowork.html" class="flex items-center p-6 bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all border border-slate-100 group">
                <img src="fittowork.png" alt="Fit to Work" class="w-16 h-16 rounded-full object-cover mr-5 border-2 border-slate-100 group-hover:scale-105 transition-transform flex-shrink-0">
                <div>
                    <h2 class="text-lg font-bold text-slate-900 group-hover:text-blue-700 transition-colors">Fit to Work</h2>
                    <p class="text-xs text-slate-500 mt-1">Pemeriksaan kesehatan mandiri harian.</p>
                </div>
            </a>

            <!-- 2. Permit to Work (Request) -->
            <a href="ptw.html" class="flex items-center p-6 bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all border border-slate-100 group">
                <img src="permittowork.png" alt="Permit to Work" class="w-16 h-16 rounded-full object-cover mr-5 border-2 border-slate-100 group-hover:scale-105 transition-transform flex-shrink-0">
                <div>
                    <h2 class="text-lg font-bold text-slate-900 group-hover:text-blue-700 transition-colors">Permit to Work</h2>
                    <p class="text-xs text-slate-500 mt-1">Ajukan izin kerja berisiko tinggi.</p>
                </div>
            </a>

            <!-- 3. Hazard Report -->
            <a href="hazard.html" class="flex items-center p-6 bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all border border-slate-100 group">
                <img src="hazardreport.png" alt="Hazard Report" class="w-16 h-16 rounded-full object-cover mr-5 border-2 border-slate-100 group-hover:scale-105 transition-transform flex-shrink-0">
                <div>
                    <h2 class="text-lg font-bold text-slate-900 group-hover:text-amber-700 transition-colors">Hazard Report</h2>
                    <p class="text-xs text-slate-500 mt-1">Laporkan bahaya atau kondisi tidak aman.</p>
                </div>
            </a>

            <!-- 4. Monitoring PTW -->
            <a href="monitoring.html" class="flex items-center p-6 bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all border border-slate-100 group">
                <div class="w-16 h-16 rounded-full bg-emerald-100 flex items-center justify-center mr-5 border-2 border-emerald-50 group-hover:bg-emerald-200 transition-colors flex-shrink-0">
                    <span class="text-2xl">📊</span>
                </div>
                <div>
                    <h2 class="text-lg font-bold text-slate-900 group-hover:text-emerald-700 transition-colors">Monitoring PTW</h2>
                    <p class="text-xs text-slate-500 mt-1">Pantau status izin kerja yang aktif.</p>
                </div>
            </a>

        </div>
    </main>

</body>
</html>
