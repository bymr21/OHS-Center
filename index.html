<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OHS Center Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-6 py-8">
            <h1 class="text-3xl font-extrabold text-slate-900">OHS Center</h1>
            <p class="text-slate-500 mt-1">Sistem Manajemen Keselamatan Kerja Terintegrasi</p>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 py-10">
        <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-widest mb-6">Menu Utama</h2>
        
        <!-- Grid Menu -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <!-- 1. Fit to Work -->
            <a href="fittowork.html" class="flex items-center p-6 bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all border border-slate-100 group">
                <img src="fittowork.png" class="w-16 h-16 rounded-full object-cover mr-5 border group-hover:scale-105 transition-transform">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 group-hover:text-blue-700 transition-colors">Fit to Work</h2>
                    <p class="text-sm text-slate-500 mt-1">Pemeriksaan kesehatan mandiri harian.</p>
                </div>
            </a>

            <!-- 2. Permit to Work (Request) -->
            <a href="ptw.html" class="flex items-center p-6 bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all border border-slate-100 group">
                <img src="permittowork.png" class="w-16 h-16 rounded-full object-cover mr-5 border group-hover:scale-105 transition-transform">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 group-hover:text-blue-700 transition-colors">Permit to Work</h2>
                    <p class="text-sm text-slate-500 mt-1">Ajukan izin kerja berisiko tinggi.</p>
                </div>
            </a>

            <!-- 3. Hazard Report -->
            <a href="hazard.html" class="flex items-center p-6 bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all border border-slate-100 group">
                <div class="w-16 h-16 rounded-full bg-amber-100 flex items-center justify-center mr-5 group-hover:bg-amber-200 transition-colors">
                    <span class="text-2xl">⚠️</span>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-slate-900 group-hover:text-amber-700 transition-colors">Hazard Report</h2>
                    <p class="text-sm text-slate-500 mt-1">Laporkan bahaya atau kondisi tidak aman.</p>
                </div>
            </a>

            <!-- 4. Monitoring PTW -->
            <a href="monitoring.html" class="flex items-center p-6 bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all border border-slate-100 group">
                <div class="w-16 h-16 rounded-full bg-emerald-100 flex items-center justify-center mr-5 group-hover:bg-emerald-200 transition-colors">
                    <span class="text-2xl">📊</span>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-slate-900 group-hover:text-emerald-700 transition-colors">Monitoring PTW</h2>
                    <p class="text-sm text-slate-500 mt-1">Pantau status izin kerja yang aktif.</p>
                </div>
            </a>

        </div>
    </main>
</body>
</html>
