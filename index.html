<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal OHS Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-8 text-center space-y-6">
        
        <!-- Header / Logo -->
        <div>
            <h1 class="text-xl font-bold text-slate-800">Portal OHS Center</h1>
            <p class="text-xs text-slate-500 mt-1">Silakan pilih menu layanan di bawah ini</p>
        </div>

        <!-- Menu Grid ala HP (2 Kolom) -->
        <div class="grid grid-cols-2 gap-4 pt-2">
            
            <!-- Menu 1: Fit to Work (Mengarah ke fit-to-work.html) -->
            <a href="fit-to-work.html" class="flex flex-col items-center justify-center p-5 bg-blue-50 hover:bg-blue-100 border border-blue-100 rounded-2xl transition group shadow-sm">
                <div class="w-14 h-14 bg-blue-600 text-white rounded-2xl flex items-center justify-center text-2xl shadow-md group-hover:scale-105 transition">
                    📋
                </div>
                <span class="text-xs font-bold text-slate-700 mt-3 text-center leading-tight">Fit to Work Assessment</span>
            </a>

            <!-- Menu 2: Permit to Work (Mengarah ke ptw.html) -->
            <a href="ptw.html" class="flex flex-col items-center justify-center p-5 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-2xl transition group shadow-sm">
                <div class="w-14 h-14 bg-slate-800 text-white rounded-2xl flex items-center justify-center text-2xl shadow-md group-hover:scale-105 transition">
                    🛠️
                </div>
                <span class="text-xs font-bold text-slate-700 mt-3 text-center leading-tight">Request Permit to Work (PTW)</span>
            </a>

        </div>

        <!-- Footer Note -->
        <div class="text-[11px] text-slate-400 pt-4 border-t border-slate-100">
            Safety & Health Monitoring System
        </div>

    </div>

</body>
</html>
