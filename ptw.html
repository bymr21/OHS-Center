<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Permit to Work (PTW)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen py-8">

    <main class="max-w-xl w-full mx-auto p-4">
        <!-- Header -->
        <div class="bg-white p-6 rounded-t-2xl shadow-sm border-b border-slate-200">
            <h1 class="text-xl font-bold text-slate-800">Request Permit to Work (PTW)</h1>
            <p class="text-xs text-slate-500 mt-0.5">OHS Center - Safety & Health Monitoring</p>
        </div>

        <!-- Form -->
        <form id="ptwForm" class="bg-white p-6 rounded-b-2xl shadow-lg border border-slate-200 space-y-6">
            
            <!-- Biodata -->
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">NAMA KARYAWAN *</label>
                <input type="text" id="nama" required placeholder="Nama lengkap Anda" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">NOMOR INDUK KARYAWAN (NIK) *</label>
                <input type="text" id="nik" required placeholder="Nomor NIK" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">NOMOR HP / WHATSAPP *</label>
                <input type="tel" id="nohp" required placeholder="08xxxxxxxxxx" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">SECTION *</label>
                <input type="text" id="section" required placeholder="Departemen/Section" class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Detail Pekerjaan -->
            <div class="border-t pt-6 space-y-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">JENIS PEKERJAAN *</label>
                    <select id="jenispekerjaan" required class="w-full px-4 py-2 border border-slate-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="" disabled selected>Pilih Kategori...</option>
                        <option value="HOT WORK">HOT WORK (Las/Gerinda)</option>
                        <option value="WORKING AT HEIGHT">WORKING AT HEIGHT (Ketinggian)</option>
                        <option value="CONFINED SPACE">CONFINED SPACE (Ruang Terbatas)</option>
                        <option value="ELECTRICAL">ELECTRICAL</option>
                        <option value="EXCAVATION">EXCAVATION (Penggalian)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">DESKRIPSI PEKERJAAN *</label>
                    <textarea id="deskripsi" required rows="3" placeholder="Jelaskan detail pekerjaan, lokasi, dan tindakan pencegahan..." class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">TANGGAL MULAI PEKERJAAN *</label>
                    <input type="date" id="tgl_mulai" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Upload PDF JSA -->
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">UPLOAD DOKUMEN JSA (PDF) *</label>
                    <input type="file" id="jsaFile" accept=".pdf" required 
                           class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 border border-slate-300 rounded-lg p-2">
                    <p class="text-[10px] text-slate-400 mt-1">Pastikan file sudah dalam format PDF.</p>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="w-full bg-slate-800 text-white font-bold py-4 rounded-xl hover:bg-slate-900 transition">Kirim Request PTW</button>
        </form>
    </main>

    <script>
        document.getElementById('ptwForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nama = document.getElementById('nama').value;
            const nik = document.getElementById('nik').value;
            const jenis = document.getElementById('jenispekerjaan').value;
            const tglMulai = document.getElementById('tgl_mulai').value;

            // Format Pesan WhatsApp
            let pesan = `Halo Admin OHS, ada pengajuan PTW baru:%0A%0A` +
                        `👤 *Pemohon:* ${encodeURIComponent(nama)} (${encodeURIComponent(nik)})%0A` +
                        `🛠 *Jenis:* ${encodeURIComponent(jenis)}%0A` +
                        `📅 *Mulai Pekerjaan:* ${encodeURIComponent(tglMulai)}%0A` +
                        `📄 *Status JSA:* Terlampir di Database%0A%0A` +
                        `Mohon dicek pada Google Sheet. Terima kasih.`;

            const nomorAdmin = "6282239689985";
            window.location.href = `https://wa.me/${nomorAdmin}?text=${pesan}`;
        });
    </script>
</body>
</html>
